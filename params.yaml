# params.yaml
data_version: v0       # change this to v0_v1 to use both v0 and v1
test_size: 0.2
random_seed: 42
rolling_window: 10
target_horizon: 5
model:
  n_estimators: 100
  max_depth: 5
  random_state: 42
tuning:
  n_iter: 20
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [3,5,7]
